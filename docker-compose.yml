services:
  # SmartQueue Express + Socket.IO API Backend
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smartqueue-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - smartqueue-network

  # SmartQueue React 18 + Vite Production Frontend
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: smartqueue-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - smartqueue-network

  # Optional Local Redis Cache (for Socket.IO horizontal scaling adapter)
  redis:
    image: redis:7-alpine
    container_name: smartqueue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - smartqueue-network

networks:
  smartqueue-network:
    driver: bridge
